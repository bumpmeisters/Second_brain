<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Evidence-first newsletter review</title>
  <style>
    :root{--ink:#17202a;--muted:#647181;--line:#dce2e8;--paper:#f5f7fa;--white:#fff;--blue:#3167d5;--green:#237a57;--red:#a5433d;--amber:#94600f;--radius:12px;--shadow:0 8px 28px rgba(23,32,42,.08)}
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    button,input{font:inherit}button{cursor:pointer}.app-header{padding:24px 30px 20px;background:var(--ink);color:#fff}.app-header h1{margin:0 0 5px;font-size:24px;letter-spacing:-.02em}.app-header p{margin:0;color:#c8d1da;max-width:780px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 24px;background:var(--white);border-bottom:1px solid var(--line)}.search{min-width:260px;flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
    .filter,.action,.decision{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;color:#3f4b59}.filter[aria-pressed=true]{background:#edf3ff;border-color:#a9bfe9;color:#244e9c}.action{background:var(--blue);border-color:var(--blue);color:#fff}
    .status{margin-left:auto;color:var(--muted);font-size:12px}.pilot{margin:18px 24px 0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pilot h2{margin:0 0 6px}.pilot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pilot-card{border:1px solid var(--line);border-radius:9px;padding:12px}.pilot-card h3{margin:0 0 7px}.pilot-row{padding:7px 0;border-bottom:1px solid #edf0f3}.pilot-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.shell{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:18px;padding:20px 24px 40px;min-height:calc(100vh - 150px)}
    .source-list,.profile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.source-list{padding:8px;align-self:start;max-height:calc(100vh - 190px);overflow:auto}.source{width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f3;background:#fff;padding:12px;border-radius:8px;color:var(--ink)}.source:hover,.source:focus-visible{background:#f5f8fc;outline:2px solid transparent}.source[aria-current=true]{background:#edf3ff;color:#234c9b}.source-name{display:block;font-weight:700}.source-meta{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .profile{padding:22px}.profile-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}.profile h2{font-size:24px;margin:3px 0}.description{color:var(--muted);max-width:760px;margin:0}.decision-state{font-size:12px;font-weight:700;color:var(--blue);background:#edf3ff;padding:6px 9px;border-radius:7px}
    .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0}.fact{background:#f5f7f9;padding:11px;border-radius:8px}.fact b{display:block;font-size:17px}.fact span{color:var(--muted);font-size:12px}.columns{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}.panel{border:1px solid var(--line);border-radius:9px;padding:14px}.panel h3{font-size:14px;margin:0 0 8px}.panel h3:not(:first-child){margin-top:18px}.clean-list{margin:0;padding-left:18px}.clean-list li+li{margin-top:5px}.muted{color:var(--muted)}
    details{border-top:1px solid var(--line);margin-top:18px;padding-top:13px}summary{cursor:pointer;font-weight:700}.issue{padding:12px 0;border-bottom:1px solid #edf0f3}.issue-title{font-weight:700}.excerpt{color:#405063;border-left:3px solid #83a5eb;padding-left:9px;margin:7px 0}.link-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.url{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}.copy{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 7px;font-size:11px}
    .decisions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.decision[data-value=selected][aria-pressed=true],.decision[data-feedback-action=retain][aria-pressed=true]{background:#e9f7f0;border-color:#acd6c3;color:#175f42}.decision[data-value=not_selected][aria-pressed=true],.decision[data-feedback-action=reject][aria-pressed=true]{background:#fff0ef;border-color:#e1b2ae;color:#81352f}.decision[data-value=undecided][aria-pressed=true],.decision[data-feedback-action=correct][aria-pressed=true]{background:#fff7e8;border-color:#e4ca94;color:#77500e}
    .empty,.error{padding:40px;text-align:center;color:var(--muted)}.error{color:var(--red)}.hidden{display:none!important}@media(max-width:820px){.shell{grid-template-columns:1fr}.source-list{max-height:260px}.facts{grid-template-columns:repeat(2,1fr)}.columns,.pilot-grid{grid-template-columns:1fr}.profile-head{display:block}.decision-state{display:inline-block;margin-top:10px}.status{width:100%;margin-left:0}}
    @media(prefers-reduced-motion:no-preference){.profile{animation:appear .18s ease-out}@keyframes appear{from{opacity:.55;transform:translateY(3px)}}}
  </style>
</head>
<body>
  <header class="app-header"><h1>Evidence-first newsletter review</h1><p>Inspect what each recurring newsletter actually delivered. The workspace describes evidence; you keep the judgment.</p></header>
  <div class="toolbar">
    <input class="search" id="search" type="search" aria-label="Search newsletters" placeholder="Search names, themes, or caveats">
    <button class="filter" data-filter="all" aria-pressed="true">All</button><button class="filter" data-filter="selected" aria-pressed="false">Selected</button><button class="filter" data-filter="undecided" aria-pressed="false">Undecided</button><button class="filter" data-filter="not_selected" aria-pressed="false">Not selected</button>
    <button class="action" id="copyManifest">Copy decisions</button><button class="action" id="exportManifest">Export decisions</button><span class="status" id="status" role="status">Selections are provisional</span>
  </div>
  <section class="pilot hidden" id="thinSlice" aria-labelledby="thinSliceTitle"></section>
  <main class="shell"><aside class="source-list" id="sourceList" aria-label="Newsletter profiles"></aside><section class="profile" id="profile" aria-live="polite"></section></main>
  <script type="application/json" id="newsletterData">__NEWSLETTER_DATA__</script>
  <script>
  (()=>{'use strict';
    const $=id=>document.getElementById(id), list=$('sourceList'), profile=$('profile'), status=$('status');
    let data;try{data=JSON.parse($('newsletterData').textContent)}catch(e){profile.className='profile error';profile.textContent='The workspace data could not be read. Regenerate it from validated records.';return}
    const profiles=Array.isArray(data.profiles)?data.profiles:[],issues=Array.isArray(data.issues)?data.issues:[],thin=data.thin_slice;
    const valid=new Set(['selected','not_selected','undecided']);let saved={...(data.initial_decisions||{})};try{saved={...saved,...JSON.parse(localStorage.getItem('newsletter-source-decisions-v1')||'{}')}}catch(e){}
    for(const p of profiles)if(!valid.has(saved[p.newsletter_id]))saved[p.newsletter_id]='undecided';let active=profiles[0]?.newsletter_id||null,filter='all';
    const el=(tag,text,cls)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
    const addList=(host,items,empty='Not observed in this sample.')=>{const ul=el('ul',undefined,'clean-list');const values=(items||[]).filter(Boolean);for(const item of values)ul.append(el('li',typeof item==='string'?item:item.text));if(!values.length)ul.append(el('li',empty,'muted'));host.append(ul)};
    const manifest=()=>({schema_version:'1.0',record_type:'source_decisions',exported_at:new Date().toISOString(),decisions:profiles.map(p=>({newsletter_id:p.newsletter_id,decision:saved[p.newsletter_id]||'undecided',note:''}))});
    async function copyText(text){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return}const area=el('textarea',text);area.setAttribute('aria-hidden','true');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}
    function downloadJson(filename,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
    const persist=()=>{localStorage.setItem('newsletter-source-decisions-v1',JSON.stringify(saved));status.textContent='Provisional selections saved locally'};
    function renderThinSlice(){if(!thin)return;const host=$('thinSlice');host.classList.remove('hidden');host.append(el('h2','Thin-slice knowledge review'));host.lastChild.id='thinSliceTitle';host.append(el('p','Audit gate decisions, retrieval outcomes, and at most three staged analyses. Feedback remains provisional and cannot promote wiki content.','description'));
      const grid=el('div',undefined,'pilot-grid'),gates=el('div',undefined,'pilot-card'),retrievals=el('div',undefined,'pilot-card'),analyses=el('div',undefined,'pilot-card');gates.append(el('h3','Gate audit'));
      for(const gate of thin.gate_results||[]){const row=el('div',undefined,'pilot-row');row.append(el('b',`${gate.candidate_id}: ${gate.disposition}`),el('div',gate.reason||'No reason recorded.','muted'));gates.append(row)}
      retrievals.append(el('h3','Retrieval outcomes'));for(const outcome of (thin.retrieval_outcomes||[]).slice(0,10)){const row=el('div',undefined,'pilot-row');row.append(el('b',outcome.candidate_id),el('div',`Coverage: ${outcome.coverage||'unknown'}`,'muted'));retrievals.append(row)}
      analyses.append(el('h3','Staged deep analyses'));const key=`newsletter-thin-slice-${thin.pilot_id}`;let feedback=[];try{const stored=JSON.parse(localStorage.getItem(key)||'[]');feedback=Array.isArray(stored)?stored:[]}catch(e){}
      const maxFeedback=30,latestFeedback=analysisId=>[...feedback].reverse().find(item=>item.analysis_id===analysisId)?.action||null;for(const analysis of (thin.source_analyses||[]).slice(0,3)){const card=el('div',undefined,'pilot-row');card.append(el('b',analysis.title||analysis.analysis_id),el('p',analysis.summary||'No summary recorded.','muted'));const actions=el('div',undefined,'pilot-actions'),selection=el('div',undefined,'muted');const paintSelection=selected=>{for(const button of actions.querySelectorAll('[data-feedback-action]'))button.setAttribute('aria-pressed',String(button.dataset.feedbackAction===selected));selection.textContent=selected?`Selected: ${selected}`:'No feedback selected'};for(const action of ['Retain','Reject','Correct']){const normalized=action.toLowerCase(),b=el('button',action,'decision');b.type='button';b.dataset.feedbackAction=normalized;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{const last=feedback[feedback.length-1];if(last?.analysis_id===analysis.analysis_id&&last?.action===normalized){paintSelection(normalized);status.textContent='Identical consecutive feedback was not duplicated';return}if(feedback.length>=maxFeedback){status.textContent='Thin-slice feedback limit reached; export or clear the local draft';return}feedback.push({analysis_id:analysis.analysis_id,action:normalized,created_at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(feedback));paintSelection(normalized);status.textContent=`${action} feedback appended locally; no authority changed`});actions.append(b)}paintSelection(latestFeedback(analysis.analysis_id));card.append(actions,selection);analyses.append(card)}
      const exportButton=el('button','Export review','action');exportButton.type='button';exportButton.addEventListener('click',()=>{downloadJson('newsletter-review.json',{pilot_id:thin.pilot_id,feedback});status.textContent='Provisional review exported'});analyses.append(exportButton);grid.append(gates,retrievals,analyses);host.append(grid)}
    function matches(p){const q=$('search').value.trim().toLowerCase(),decision=saved[p.newsletter_id]||'undecided';if(filter!=='all'&&decision!==filter)return false;return !q||JSON.stringify([p.name,p.description,p.recurring_themes,p.caveats,p.relevance_hypotheses]).toLowerCase().includes(q)}
    function renderList(){list.replaceChildren();const visible=profiles.filter(matches);if(!visible.length){list.append(el('div','No profiles match this view.','empty'));profile.replaceChildren(el('div','Choose another filter or search term.','empty'));return}if(!visible.some(p=>p.newsletter_id===active))active=visible[0].newsletter_id;for(const p of visible){const b=el('button',undefined,'source');b.type='button';b.dataset.id=p.newsletter_id;b.setAttribute('aria-current',String(p.newsletter_id===active));b.append(el('span',p.name||'Unnamed newsletter','source-name'),el('span',`${(p.issue_ids||[]).length} issues · ${(saved[p.newsletter_id]||'undecided').replace('_',' ')}`,'source-meta'));b.addEventListener('click',()=>{active=p.newsletter_id;renderList();renderProfile()});list.append(b)}renderProfile()}
    function heading(host,text){host.append(el('h3',text))}
    function renderProfile(){const p=profiles.find(x=>x.newsletter_id===active);profile.replaceChildren();if(!p){profile.append(el('div','No newsletter profiles are available yet.','empty'));return}const head=el('div',undefined,'profile-head'),intro=el('div');intro.append(el('div',`Profile based on ${(p.issue_ids||[]).length} issues · ${p.date_range?.from||'unknown'}–${p.date_range?.to||'unknown'}`,'eyebrow'),el('h2',p.name||'Unnamed newsletter'),el('p',p.description||'No description available.','description'));head.append(intro,el('span',(saved[p.newsletter_id]||'undecided').replace('_',' '),'decision-state'));profile.append(head);
      const facts=el('div',undefined,'facts');for(const [value,label] of [[(p.issue_ids||[]).length,'issues analyzed'],[(p.recurring_themes||[]).length,'recurring themes'],[(p.sender_addresses||[]).length,'sender addresses'],[p.identity_confidence||'unknown','identity confidence']]){const f=el('div',undefined,'fact');f.append(el('b',value),el('span',label));facts.append(f)}profile.append(facts);
      const cols=el('div',undefined,'columns'),left=el('div',undefined,'panel'),right=el('div',undefined,'panel');heading(left,'What it consistently delivers');addList(left,p.recurring_themes);heading(left,'Potential downstream value (hypotheses)');addList(left,p.relevance_hypotheses,'No downstream-value hypothesis is confirmed.');heading(left,'Wiki overlap');addList(left,p.wiki_overlap,'No overlap assessed yet.');heading(right,'Reasons to distrust or discount');addList(right,p.caveats);heading(right,'Promotion characteristics');addList(right,p.promotion_characteristics);heading(right,'Evidence characteristics');addList(right,p.evidence_characteristics);cols.append(left,right);profile.append(cols);
      const d=el('details'),s=el('summary',`Representative issue evidence (${(p.issue_ids||[]).length})`);d.append(s);for(const issue of issues.filter(i=>(p.issue_ids||[]).includes(i.issue_id))){const row=el('article',undefined,'issue');row.append(el('div',issue.subject||'Untitled issue','issue-title'),el('div',issue.received_at||'Date unavailable','muted'));for(const ex of issue.evidence_excerpts||[])row.append(el('p',ex.text,'excerpt'));for(const link of issue.links||[]){const lr=el('div',undefined,'link-row'),code=el('span',link.url,'url'),copy=el('button','Copy link','copy');copy.type='button';copy.addEventListener('click',async()=>{await copyText(link.url);status.textContent='Link copied — no site was opened'});lr.append(code,copy);row.append(lr)}d.append(row)}profile.append(d);
      const choices=el('div',undefined,'decisions');for(const [value,label] of [['selected','Select for pilot'],['undecided','Keep undecided'],['not_selected','Not selected']]){const b=el('button',label,'decision');b.type='button';b.dataset.value=value;b.setAttribute('aria-pressed',String(saved[p.newsletter_id]===value));b.addEventListener('click',()=>{saved[p.newsletter_id]=value;persist();renderList();renderProfile()});choices.append(b)}profile.append(choices)}
    if(thin){renderThinSlice();document.querySelector('.app-header h1').textContent='Newsletter knowledge review';document.querySelector('.app-header p').textContent='Review the staged analyses and export one decision file.';document.querySelector('.toolbar').remove();document.querySelector('.shell').remove();return}
    for(const b of document.querySelectorAll('.filter'))b.addEventListener('click',()=>{filter=b.dataset.filter;for(const x of document.querySelectorAll('.filter'))x.setAttribute('aria-pressed',String(x===b));renderList()});$('search').addEventListener('input',renderList);
    $('copyManifest').addEventListener('click',async()=>{await copyText(JSON.stringify(manifest(),null,2));status.textContent='Decision manifest copied; it is not authoritative until imported'});
    $('exportManifest').addEventListener('click',()=>{downloadJson('newsletter-source-decisions.json',manifest());status.textContent='Decision manifest exported; explicit import is still required'});
    renderList();
  })();
  </script>
</body></html>
