name: Source governance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out without LFS payloads
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        shell: powershell
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0

      - name: Verify runtime contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/runtime/python-runtime.tests.ps1

      - name: Verify publication boundary
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/publication/publication-boundary.tests.ps1

      - name: Verify source-conversion contracts
        shell: powershell
        run: |
          $tests = @(
            'tests/source-conversion/policy-contract.tests.ps1',
            'tests/source-conversion/source-library-contract.tests.ps1',
            'tests/source-conversion/incremental-selection.tests.ps1',
            'tests/source-conversion/conversion-orchestrator.tests.ps1',
            'tests/source-conversion/pre-ingest-gate.tests.ps1'
          )
          foreach ($test in $tests) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Contract test failed: $test"
            }
          }

      - name: Verify source-curation contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/source-curation/source-curation-package.tests.ps1

      - name: Verify clipping-intake and selection contracts
        shell: powershell
        run: |
          $tests = @(
            'tests/clipping-intake/clipping-intake.tests.ps1',
            'tests/clipping-intake/disposition-gate.tests.ps1',
            'tests/clipping-intake/backlog-selection-gate.tests.ps1'
          )
          foreach ($test in $tests) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Contract test failed: $test"
            }
          }

      - name: Verify semantic-ingest and transaction contracts
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/semantic-ingest/run-tests.ps1

      - name: Verify wiki-integrity contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/wiki-integrity/wiki-integrity.tests.ps1

      - name: Verify newsletter index generator contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/newsletter-index/newsletter-index.tests.ps1

      - name: Verify test cleanup
        shell: powershell
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Contract tests left tracked or untracked changes: $($changes -join ', ')"
          }
